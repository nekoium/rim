[package]
name = "rim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Temporary solution trees for AI-assisted development"
repository = "https://github.com/nekoium/rim"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
fs4 = "0.13"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.14"
